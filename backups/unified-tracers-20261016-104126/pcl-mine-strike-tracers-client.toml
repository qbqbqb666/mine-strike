enabled = true
tacz = true
superbWarfare = true
#Also enhance the local player's bullets. Off avoids duplicating native first-person tracers.
showOwnShots = false
#Maximum visible streak length in blocks.
#Range: 0.5 ~ 12.0
length = 6.0
#Fade duration in game seconds; 0.15 is three ticks.
#Range: 0.05 ~ 0.4
lifetime = 0.15
#Core streak half-width in world units.
#Range: 0.005 ~ 0.08
width = 0.025
#Passing trajectories within this distance of the camera receive a short local emphasis.
#Range: 0.5 ~ 6.0
nearRadius = 3.0
#Range: 1.0 ~ 3.0
nearBoost = 1.8
#Range: 16.0 ~ 256.0
maxDistance = 128.0
#Maximum rendered streaks per frame; closest trajectories have priority.
#Range: 16 ~ 1024
maxStreaks = 256

